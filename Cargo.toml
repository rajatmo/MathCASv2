[workspace]
resolver = "2"
members = ["crates/*"]
# the design spikes are kept for reference, outside the build: `cargo build` in a spike's own folder builds it
exclude = ["spikes"]

[workspace.package]
version = "0.4.0"
authors = ["Rajat Mandal"]
license = "GPL-3.0-or-later"
repository = "https://github.com/rajatmo/MathCASv2"

[profile.release]
debug = 1
