[package]
name = "mc-calculus"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 calculus: symbolic differentiation (d, gradients, higher and mixed derivatives, the derivative operator), partial fractions, properties of functions, optimisation, and the helpers of the calculus crates"

[dependencies]
mc-api = { path = "../mc-api" }
mc-arith = { path = "../mc-arith" }
mc-core = { path = "../mc-core" }
# sign and truth questions of the properties answered by the decision service (package F3)
mc-decide = { path = "../mc-decide" }
mc-eval = { path = "../mc-eval" }
# the `assumptions:` option of every native
mc-poly = { path = "../mc-poly" }
rustc-hash = "2"

[dev-dependencies]
mc-engine = { path = "../mc-engine" }
