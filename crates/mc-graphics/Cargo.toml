[package]
name = "mc-graphics"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 graphics: the graphics term (primitives, directives, options), colours, and its PNG, SVG and vector PDF renderers"

[dependencies]
mc-api = { path = "../mc-api" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
# labels: printed expressions typeset as boxes, laid out with the math font's metrics
mc-boxes = { path = "../mc-boxes" }
mc-syntax = { path = "../mc-syntax" }
# glyph outlines for every renderer (STIX Two Math, SIL Open Font License)
mc-mathfont = { path = "../mc-mathfont" }
# rasterising paths; PNG encoding
tiny-skia = "0.11"
# Flate compression of PDF streams
miniz_oxide = "0.8"

[dev-dependencies]
mc-bench = { path = "../mc-bench" }
mc-engine = { path = "../mc-engine" }
# the SVG renderer checked by rendering its output with an independent SVG rasteriser
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
