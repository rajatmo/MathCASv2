[package]
name = "mc-engine"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 engine: the core assembled (syntax, evaluator, arithmetic on the real store) behind the Engine trait of mc-api"

[dependencies]
mc-api = { path = "../mc-api" }
mc-arith = { path = "../mc-arith" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
mc-load = { path = "../mc-load" }
mc-syntax = { path = "../mc-syntax" }
# every library: their installation, their MathCAS sources in load order, their FUNCTIONS
mc-libraries = { path = "../mc-libraries" }
# datasets printed as tables
mc-assoc = { path = "../mc-assoc" }
# the numeric compiler's queue, registered after each statement
mc-jit = { path = "../mc-jit" }
# uncertain numbers and machine functions in the arithmetic and on packed arrays
mc-numeric = { path = "../mc-numeric" }
# plot files of the session, pictures of values
mc-plot = { path = "../mc-plot" }
# series arithmetic
mc-poly = { path = "../mc-poly" }
