[package]
name = "mc-eval"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 evaluator: pattern matcher, rule indexes and the speculative parallel evaluator on mc-core"

[dependencies]
mc-api = { path = "../mc-api" }
mc-core = { path = "../mc-core" }
parking_lot = "0.12"
rayon = "1.12"
# for `current_thread_has_pending_tasks`, which the lazy granularity rule consults (spike 4)
rayon-core = "1.12"
rustc-hash = "2"

[dev-dependencies]
# the speed example drives the assembled engine (a development-only cycle: the engine depends on this crate)
mc-engine = { path = "../mc-engine" }

# the memory budget of an evaluation reads the process's memory limits (decision p6core.11)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
