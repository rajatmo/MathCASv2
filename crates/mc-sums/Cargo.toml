[package]
name = "mc-sums"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 sums and recurrences: Gosper's and Zeilberger's algorithms, hypergeometric solutions of linear recurrences (Petkovsek, Abramov), products in closed form, numeric sums"

[dependencies]
mc-api = { path = "../mc-api" }
mc-arith = { path = "../mc-arith" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
# the compiled summand of the long finite loops
mc-numfn = { path = "../mc-numfn" }
# integer polynomials: gcd, factorisation, conversion between terms and polynomials
mc-poly = { path = "../mc-poly" }
# the complexity measure that picks between equal forms (read only)
mc-simplify = { path = "../mc-simplify" }
rustc-hash = "2"

[dev-dependencies]
mc-engine = { path = "../mc-engine" }
