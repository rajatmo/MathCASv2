[package]
name = "mc-plot"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 plots: plot and list_plot (linear and logarithmic axes) built as graphics terms and rendered to PNG, SVG and PDF files"

[dependencies]
mc-api = { path = "../mc-api" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
# the graphics term, its renderers and colours
mc-graphics = { path = "../mc-graphics" }
# regions: conditions as margins, region bounds for region_plot
mc-geom = { path = "../mc-geom" }
# names of plotted expressions in the data sidecar
mc-syntax = { path = "../mc-syntax" }
# compiled evaluation of the plotted function
mc-numfn = { path = "../mc-numfn" }
# the exporter of graphics for export_data
mc-io = { path = "../mc-io" }
# animated GIF files of graphics (MIT OR Apache-2.0; colour quantisation by color_quant, MIT)
gif = "0.14"

[dev-dependencies]
mc-bench = { path = "../mc-bench" }
mc-engine = { path = "../mc-engine" }
# reading the PNG and the data sidecar back in tests
tiny-skia = "0.11"
serde_json = "1"
