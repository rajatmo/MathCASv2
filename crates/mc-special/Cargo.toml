[package]
name = "mc-special"
version = "0.0.0"
edition = "2021"
publish = false
description = "MathCAS v2 special functions: gamma family, zeta, Bessel, error functions, incomplete gamma and beta, exponential integrals, polylog, hypergeometric, elliptic and Jacobi functions (exact values, machine reals, rigorous balls)"

[dependencies]
mc-api = { path = "../mc-api" }
mc-arith = { path = "../mc-arith" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
mc-numeric = { path = "../mc-numeric" }

[dev-dependencies]
mc-bench = { path = "../mc-bench" }
# tests that evaluate source text through the assembled core
mc-engine = { path = "../mc-engine" }
