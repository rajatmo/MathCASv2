[package]
name = "mc-notebook-android"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 notebook for Android: the native library the activity loads (empty on every other system)"

[lib]
# a shared library: Android's NativeActivity loads `libmc_notebook_android.so` and calls into it
crate-type = ["cdylib"]
path = "src/lib.rs"

[target.'cfg(target_os = "android")'.dependencies]
mc-notebook = { path = "../mc-notebook" }
mc-ui = { path = "../mc-ui" }
