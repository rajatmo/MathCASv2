[package]
name = "mc-decide"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 decisions under assumptions: sign, zero, interval and integrality questions answered once for refine, simplify, limit, integrate and solve; conditional results and condition accumulation"

[dependencies]
