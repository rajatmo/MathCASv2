[package]
name = "mc-lsp"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 language server: diagnostics, definitions, hover, completion, signature help and document symbols over stdio"

[dependencies]
mc-api = { path = "../mc-api" }
mc-load = { path = "../mc-load" }
# every library's FUNCTIONS table (completion, hover)
mc-libraries = { path = "../mc-libraries" }
mc-help = { path = "../mc-help" }
mc-syntax = { path = "../mc-syntax" }
serde_json = "1"

[[bin]]
name = "mc-lsp"
path = "src/main.rs"
# no documentation for the binary: its name is the library's, and the two would collide
doc = false

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
