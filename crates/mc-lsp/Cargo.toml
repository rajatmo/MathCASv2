[package]
name = "mc-lsp"
version = "0.0.0"
edition = "2021"
publish = false
description = "MathCAS v2 language server: diagnostics, definitions, hover, completion and document symbols over stdio"

[dependencies]
mc-api = { path = "../mc-api" }
mc-assoc = { path = "../mc-assoc" }
mc-calculus = { path = "../mc-calculus" }
mc-linalg = { path = "../mc-linalg" }
mc-lists = { path = "../mc-lists" }
mc-load = { path = "../mc-load" }
mc-numeric = { path = "../mc-numeric" }
mc-numtheory = { path = "../mc-numtheory" }
mc-poly = { path = "../mc-poly" }
mc-random = { path = "../mc-random" }
mc-ode = { path = "../mc-ode" }
mc-plot = { path = "../mc-plot" }
mc-io = { path = "../mc-io" }
mc-quad = { path = "../mc-quad" }
mc-roots = { path = "../mc-roots" }
mc-simplify = { path = "../mc-simplify" }
mc-solve = { path = "../mc-solve" }
mc-special = { path = "../mc-special" }
mc-strings = { path = "../mc-strings" }
mc-syntax = { path = "../mc-syntax" }
serde_json = "1"

[[bin]]
name = "mc-lsp"
path = "src/main.rs"
# no documentation for the binary: its name is the library's, and the two would collide
doc = false

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
