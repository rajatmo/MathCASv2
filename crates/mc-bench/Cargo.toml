[package]
name = "mc-bench"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 benchmark harness: case files, guarded child-process runs, progress, results and summary"

# Almost no dependencies on purpose: the harness drives any engine through the `Engine` trait, so it neither parses nor
# evaluates the concrete syntax itself (decision D.1).
[dependencies]

# The Unix guard's resource limit and `wait4` (RlimitGuard).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
