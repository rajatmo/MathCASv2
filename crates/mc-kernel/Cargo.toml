[package]
name = "mc-kernel"
version = "0.0.0"
edition = "2021"
publish = false
description = "MathCAS v2 kernel protocol (JSON lines over stdio), the .mcn notebook format and the notebook runner"

[dependencies]
mc-nbfile = { path = "../mc-nbfile" }
mc-bench = { path = "../mc-bench" }
mc-engine = { path = "../mc-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
