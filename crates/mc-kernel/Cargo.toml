[package]
name = "mc-kernel"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 kernel protocol (JSON lines over stdio), the .mcn notebook format and the notebook runner"

[dependencies]
mc-nbfile = { path = "../mc-nbfile" }
mc-bench = { path = "../mc-bench" }
mc-engine = { path = "../mc-engine" }
# attributes of the heads front ends handle (`front_end`)
mc-eval = { path = "../mc-eval" }
mc-api = { path = "../mc-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
