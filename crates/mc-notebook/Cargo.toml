[package]
name = "mc-notebook"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 notebook window: cells, evaluation in a separate mc-kernel process, One Light and One Dark themes"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mc-notebook"
path = "src/main.rs"

[dependencies]
# the platform's features are named by mc-ui
eframe = { version = "0.37.0", default-features = false, features = ["links", "system_fonts", "wgpu"] }
mc-boxes = { path = "../mc-boxes" }
# printed outputs read into boxes for painting
mc-typeset = { path = "../mc-typeset" }
# 3D pictures drawn again from another view point (`view3d`: no evaluator involved, never mc-engine)
mc-graphics = { path = "../mc-graphics" }
mc-help = { path = "../mc-help" }
mc-mathfont = { path = "../mc-mathfont" }
mc-nbfile = { path = "../mc-nbfile" }
# File > Export: HTML and PDF
mc-nbexport = { path = "../mc-nbexport" }
mc-nbmodel = { path = "../mc-nbmodel" }
mc-syntax = { path = "../mc-syntax" }
mc-ui = { path = "../mc-ui" }
flate2 = "1"
png = "0.18"
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
serde_json = "1"

# the system's file dialogs (a native Android program has none: the notebook shows its own, `app/pick.rs`)
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
