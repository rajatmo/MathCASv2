[package]
name = "mc-algebra"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 algebraic numbers: number fields Q[t]/(f) with embeddings, primitive elements, polynomials over number fields (gcd, factorisation) and sums over the roots of a polynomial"

[dependencies]
mc-api = { path = "../mc-api" }
mc-arith = { path = "../mc-arith" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
# complex balls for certified root enclosures (embeddings)
mc-numeric = { path = "../mc-numeric" }
# integer polynomials: factorisation over Q, resultants, arithmetic modulo primes
mc-poly = { path = "../mc-poly" }
rustc-hash = "2"

[dev-dependencies]
mc-engine = { path = "../mc-engine" }
