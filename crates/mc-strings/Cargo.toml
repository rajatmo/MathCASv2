[package]
name = "mc-strings"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
publish = false
description = "MathCAS v2 string functions: splitting, replacing, slicing, searching, case, characters, padding, trimming and reading text as source, by Unicode characters"

[dependencies]
mc-api = { path = "../mc-api" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
# the reader, for `to_expression`
mc-syntax = { path = "../mc-syntax" }

[dev-dependencies]
# the tests evaluate source text on the assembled core
mc-engine = { path = "../mc-engine" }
