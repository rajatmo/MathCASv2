[package]
name = "mc-random"
version = "0.0.0"
edition = "2021"
publish = false
description = "MathCAS v2 random numbers: the session generator (counter-based Philox4x32-10), seed, random_real, random_integer, random_normal, random_choice, random_sample"

[dependencies]
