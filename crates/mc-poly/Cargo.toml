[package]
name = "mc-poly"
version = "0.0.0"
edition = "2021"
publish = false
description = "MathCAS v2 polynomial algebra: packed sparse multivariate polynomials, expansion, gcd, factorisation, resultants, rational functions and truncated power series"

[dependencies]
mc-api = { path = "../mc-api" }
mc-arith = { path = "../mc-arith" }
mc-core = { path = "../mc-core" }
mc-eval = { path = "../mc-eval" }
rustc-hash = "2"

[dev-dependencies]
mc-engine = { path = "../mc-engine" }
mc-syntax = { path = "../mc-syntax" }
num-bigint = "0.4"
num-traits = "0.2"
