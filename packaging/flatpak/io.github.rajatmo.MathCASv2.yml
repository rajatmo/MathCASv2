# Flatpak manifest of MathCAS v2 (the notebook, with the documentation window, the REPL, the kernel and the
# language server beside it). Built from the release tag without network access: the crates are the sources of
# cargo-sources.json (packaging/flatpak/gen-cargo-sources.py writes it from Cargo.lock).
#   flatpak-builder --user --install --force-clean build-dir io.github.rajatmo.MathCASv2.yml
#   flatpak run io.github.rajatmo.MathCASv2
app-id: io.github.rajatmo.MathCASv2
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mc-notebook
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # notebooks are opened and saved by path (recent files, files given on the command line)
  - --filesystem=home
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/mathcas/cargo
    CARGO_NET_OFFLINE: 'true'
    MC_COMMIT: 7a92670
modules:
  - name: mathcas
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --offline -p mc-repl -p mc-engine -p mc-lsp -p mc-kernel -p mc-notebook -p mc-docs
      - install -Dm755 -t /app/bin target/release/mc-notebook target/release/mc-docs target/release/mc-repl
        target/release/mc-kernel target/release/mc-lsp
      - install -Dm644 io.github.rajatmo.MathCASv2.desktop -t /app/share/applications
      - install -Dm644 io.github.rajatmo.MathCASv2.metainfo.xml -t /app/share/metainfo
      - install -Dm644 io.github.rajatmo.MathCASv2.xml -t /app/share/mime/packages
      - install -Dm644 assets/app/icon_128.png /app/share/icons/hicolor/128x128/apps/io.github.rajatmo.MathCASv2.png
      - install -Dm644 assets/app/icon_256.png /app/share/icons/hicolor/256x256/apps/io.github.rajatmo.MathCASv2.png
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.rajatmo.MathCASv2
      - install -Dm644 docs/guide/quickstart.pdf -t /app/share/doc/mathcas
      - cp -r examples /app/share/doc/mathcas/examples
    sources:
      - type: git
        url: https://github.com/rajatmo/MathCASv2.git
        tag: v0.16.1
        commit: 7a92670387f6d481dd8c9ea5418a75b46b81f8b6
      - cargo-sources.json
      - type: file
        path: io.github.rajatmo.MathCASv2.desktop
      - type: file
        path: io.github.rajatmo.MathCASv2.metainfo.xml
      - type: file
        path: io.github.rajatmo.MathCASv2.xml
