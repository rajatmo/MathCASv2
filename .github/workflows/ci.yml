# Tests and lints on every push and pull request: the whole workspace on Windows, on Linux and on macOS (test suite,
# clippy with warnings as errors; on Windows also the documentation pages); all jobs are required. The test suite includes the licence check of
# the shipped dependencies (crates/mc-bench/tests/notices.rs). Packages come from nightly.yml (every push to main,
# the rolling `nightly` pre-release) and release.yml (tags v<version>), both through packages.yml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # line tables only in CI: smaller target folders, faster links
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  # the documentation examples' speed limit is 1 s on a development machine; the shared runners are slower
  MC_DOCS_SLOW_SECS: "4"

jobs:
  windows:
    name: Windows (tests, clippy)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: win-ci-
      - name: Clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - name: Test suite
        run: cargo test --release --locked --workspace --no-fail-fast
      - name: Documentation pages match a fresh run
        run: cargo run --release --locked -p mc-docs --bin mc-docs-pages -- check

  linux:
    name: Linux (tests, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the windowing crates
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl-dev libfontconfig-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-ci-
      - name: Clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - name: Test suite
        run: cargo test --release --locked --workspace --no-fail-fast
      # the page outputs are recorded on Windows (machine-real last bits and OS error texts differ); checked there

  macos:
    name: macOS (tests, clippy)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-ci-
      - name: Clippy
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - name: Test suite
        run: cargo test --release --locked --workspace --no-fail-fast
