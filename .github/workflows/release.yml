# Release: on a pushed tag v<version> (for example v0.2.0), build the Windows installer and zip (tools/dist.ps1,
# tools/package.ps1) and the Linux tarball (packaging/linux/build-tarball.sh), smoke-test both, and attach them to a
# GitHub release named after the tag, with that version's CHANGELOG.md section as its notes. The tag must match the
# workspace version in Cargo.toml. The tests run in ci.yml on the same commit; this workflow only packages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  version:
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer and zip
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MATHCAS_V2_DIST: ${{ github.workspace }}\dist-v2
      MATHCAS_V2_PACKAGES: ${{ github.workspace }}\dist-v2-packages
      # the build folder inside the workspace (the scripts' default is outside the repository)
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      # dist.ps1 and notices.ps1 build with --offline: fetch the dependencies first
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($known | Where-Object { Test-Path $_ })) { choco install innosetup --no-progress -y }
      - name: Build the dist folder (tools/dist.ps1)
        shell: pwsh
        run: ./tools/dist.ps1
      - name: Smoke test the binaries
        shell: pwsh
        run: |
          & "$env:MATHCAS_V2_DIST\mc-repl.exe" -e "factor(x^4 - 1)" -e "integrate(1/(1 + x^2), [x, 0, inf])"
          if ($LASTEXITCODE -ne 0) { throw "mc-repl failed ($LASTEXITCODE)" }
          if (-not (Test-Path "$env:MATHCAS_V2_DIST\THIRD-PARTY-NOTICES.txt")) { throw "no third-party notices" }
      - name: Package (tools/package.ps1)
        shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist-v2-packages/MathCAS-v2-*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux tarball
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the windowing crates
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl-dev libfontconfig-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build the tarball (packaging/linux/build-tarball.sh)
        run: JOBS=4 bash packaging/linux/build-tarball.sh dist-linux
      - name: Smoke test the tarball
        run: |
          mkdir smoke && tar -C smoke -xzf dist-linux/MathCAS-v2-*.tar.gz
          bash packaging/linux/smoke.sh smoke/MathCAS-v2-* smoke-work
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist-linux/MathCAS-v2-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v; next } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "MathCAS v2 $VERSION" > notes.md; fi
          ls -l packages
      - name: Create the release and attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/MathCAS-v2-* \
            --title "MathCAS v2 $VERSION" --notes-file notes.md --verify-tag
