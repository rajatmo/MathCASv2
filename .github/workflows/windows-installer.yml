# Builds the Windows packages (standalone zip and Inno Setup installer) with the repository's own scripts,
# tools\dist.ps1 and tools\package.ps1 (the tests run in ci.yml).
# Artifacts: MathCAS-v2-<commit>-win-x64.{exe,zip}. Start it by hand (Actions > Windows installer > Run workflow)
# or by pushing to main.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # the scripts' own overrides: keep their output inside the workspace
      MATHCAS_V2_DIST: ${{ github.workspace }}\dist-v2
      MATHCAS_V2_PACKAGES: ${{ github.workspace }}\dist-v2-packages
      # the build folder inside the workspace (the scripts' default is outside the repository)
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: win-cargo-

      # dist.ps1 builds with --offline: fetch the dependencies first
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          $known = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($known | Where-Object { Test-Path $_ })) { choco install innosetup --no-progress -y }

      - name: Build the dist folder (tools\dist.ps1)
        shell: pwsh
        run: ./tools/dist.ps1

      - name: Smoke test the binaries
        shell: pwsh
        run: |
          & "$env:MATHCAS_V2_DIST\mc-repl.exe" -e "factor(x^4 - 1)" -e "integrate(1/(1 + x^2), [x, 0, inf])" -e "seed(11); random_real()"
          if ($LASTEXITCODE -ne 0) { throw "mc-repl failed ($LASTEXITCODE)" }

      - name: Package (tools\package.ps1)
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MathCAS-v2-win-x64
          path: dist-v2-packages/MathCAS-v2-*
          if-no-files-found: error
          retention-days: 30

